<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Search Page Data by Class Names</title>
    <link href="https://fonts.googleapis.com/css?family=Roboto:300,400,500&display=swap" rel="stylesheet" />
    <style>
      body {
        font-family: 'Roboto', sans-serif;
        background: #e9ecef;
        margin: 0;
        padding: 40px;
        color: #333;
      }
      h1 {
        color: #333;
        text-align: center;
      }
      .box {
        background: white;
        padding: 30px;
        border-radius: 10px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        max-width: 500px;
        margin: 0 auto;
      }
      .input-group {
        margin-bottom: 20px;
      }
      .input-group span {
        display: block;
        margin-bottom: 5px;
        font-weight: 500;
      }
      input[type='text'] {
        width: 100%;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 16px;
        box-sizing: border-box;
      }
      button {
        width: 100px;
        padding: 15px;
        background: #007bff;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 18px;
        transition: background-color 0.3s ease;
      }
      button:hover {
        background: #0056b3;
      }
    </style>
    <link rel="stylesheet" href="popup.css" />
    <!-- Custom styles, if any -->
  </head>

  <body>
    <h1>查询内容</h1>
    <div class="box">
      <div class="input-group">
        <span>第一类名称:</span>
        <input type="text" id="filterInput" placeholder="Enter first class name" />
      </div>

      <div class="input-group">
        <span>第二类名称:</span>
        <input type="text" id="secondFilterInput" placeholder="Enter second class name" />
      </div>
      <button id="searchBtn">查询</button>
    </div>
    

    <script src="popup.js"></script>
  </body>
</html>
